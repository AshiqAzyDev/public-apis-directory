name: Update catalog

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild catalog
        run: python scripts/build.py
      - name: Run tests
        run: pytest
      - name: Open catalog-update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Refresh catalog"
          title: "Refresh catalog"
          body: |
            Weekly catalog rebuild.

            Review CHANGELOG.md for added, removed, and updated APIs.
          branch: automation/catalog-update
