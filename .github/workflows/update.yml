name: Update catalog

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch upstream and rebuild
        run: python scripts/build.py
      - name: Run tests
        run: pytest
      - name: Open catalog-update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Refresh catalog from public-apis upstream"
          title: "Refresh catalog from upstream"
          body: |
            Weekly rebuild from [public-apis/public-apis](https://github.com/public-apis/public-apis) `master`.

            Review CHANGELOG.md for added, removed, and updated APIs.
          branch: automation/upstream-update
